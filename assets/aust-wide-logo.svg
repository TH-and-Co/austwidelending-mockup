<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 60" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEBC67"/>
      <stop offset="50%" stop-color="#C29B38"/>
      <stop offset="100%" stop-color="#9E7922"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#C29B38"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#C29B38" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Australia Silhouette + Architectural Accent Icon -->
  <g transform="translate(6, 4)" filter="url(#logoGlow)">
    <!-- High-Fidelity Australia Map Silhouette in Warm Earthy Gold -->
    <path d="M 37.5 5.5
             C 36.8 7.5, 34.5 9.5, 33 11
             C 30.5 12, 29 11.5, 27.5 9
             C 25.5 7, 23 7.5, 21.5 9.5
             C 19.5 11, 16.5 12.5, 14 14.5
             C 10.5 17.5, 8.5 21, 6 25
             C 4.5 28.5, 3.8 33, 4.5 36.5
             C 5.5 41, 7.5 45.5, 10.5 47.5
             C 13 49, 16.5 48, 19.5 46.5
             C 23.5 44.5, 27.5 44.5, 31.5 45
             C 33.5 45.5, 34.5 47, 36.5 48.5
             C 39.5 50, 42.5 49, 44.5 46.5
             C 47 43.5, 48.5 39, 48.8 34.5
             C 49 29.5, 47.5 24, 45 19.5
             C 43 15.5, 40 10.5, 38.5 6.5
             Z" 
          fill="url(#goldGrad)" />
    
    <!-- Tasmania -->
    <path d="M 40.5 51.5 
             C 42 51.5, 43.5 52.8, 43 54.5 
             C 42.5 55.8, 40.8 56, 39.8 54.8 
             C 39.2 53.5, 39.5 52, 40.5 51.5 Z" 
          fill="url(#goldGrad)" />

    <!-- Minimalist Geometric Roof & Hearth Motif Inside Silhouette -->
    <path d="M 18 29.5 L 26.5 20.5 L 35 29.5" 
          stroke="#0B1E14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 29.5 L 26.5 20.5 L 35 29.5" 
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Doorway/Pillar Accent -->
    <rect x="24.5" y="27" width="4" height="6.5" rx="0.8" fill="#FFFFFF" />
  </g>

  <!-- Typography: Aust Wide Lending + MORTGAGE SOLUTIONS -->
  <g transform="translate(68, 11)">
    <text x="0" y="23" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="21.5" fill="#FFFFFF" letter-spacing="-0.025em">
      Aust<tspan fill="url(#goldText)">Wide</tspan>
      <tspan fill="#F8FAFC" font-weight="600" font-size="19.5" dx="3">Lending</tspan>
    </text>
    
    <text x="1" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="8.8" fill="#C29B38" letter-spacing="0.22em">
      MORTGAGE SOLUTIONS
    </text>
  </g>
</svg>
